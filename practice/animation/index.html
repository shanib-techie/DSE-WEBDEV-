<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
button{
    background-color: yellow;
    border-radius: 4px;
    border: 2px solid black;
    align-items: center; 
    justify-content: center;
    width: 200px;
    height: 200px;
}
/* justify-content: center; → horizontal direction mein center.
align-items: center; → vertical direction mein center. */
button:hover{
    color: pink;
    background-color: black;
    border-radius: 50%;
    border: 8px solid yellow ;
}

#nd{
    background-color: yellow;
    border-radius: 4px;
    border: 2px solid black;
    align-items: center; 
    justify-content: center;
    width: 200px;
    height: 200px;

}
#nd:active{
     color: rgb(255, 0, 43);
    background-color: black;
    border-radius: 50%;
    border: 8px solid yellow ;

}
</style>
<body>
    <button><h1>click on it</h1></button>
    <button id="nd"><h1> other button </h1></button>
    
</body>
</html>
