<!DOCTYPE html>
<html>
<head>
    <title>Padding vs Margin</title>

    <style>
        .box1 {
            background-color: lightblue;
            border: 3px solid blue;
            height: 60px;

            padding: 30px;
            margin:0px 0px 90px 10px;
        }

        .box2 {
            background-color: lightgreen;
            border: 3px solid green;
            width: 250px;
            height: 250px;
            /* text-align: center; */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            margin: 40px;
        }
    </style>
</head>

<body>

    <div class="box1">
        This is Box 1
    </div>

    <div class="box2">
        This is Box 2
    </div>

</body>
</html>
